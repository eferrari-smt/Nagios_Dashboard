<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar — Panel de control de CSL</title>
<link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="login-body">

<main class="login-card">
  <h1>Nagios CSL</h1>
  <p class="login-subtitle">Panel de control de CSL — Smartmation</p>

  <form id="loginForm" autocomplete="on">
    <label class="edit-field-label" for="username">Usuario</label>
    <input type="text" id="username" name="username" class="input-search" autocomplete="username" required autofocus>

    <label class="edit-field-label" for="password">Contraseña</label>
    <input type="password" id="password" name="password" class="input-search" autocomplete="current-password" required>

    <button type="submit" class="btn btn-primary login-submit" id="loginBtn">Ingresar</button>
    <p class="login-error" id="loginError" role="alert"></p>
  </form>
</main>

<script>
  const form = document.getElementById("loginForm");
  const error = document.getElementById("loginError");
  const boton = document.getElementById("loginBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    error.textContent = "";
    boton.disabled = true;
    boton.textContent = "Ingresando...";
    try {
      const resp = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        }),
      });
      if (!resp.ok) {
        const cuerpo = await resp.json().catch(() => ({}));
        throw new Error(cuerpo.detail || "No se pudo ingresar.");
      }
      window.location.href = "/";
    } catch (err) {
      error.textContent = err.message;
      document.getElementById("password").value = "";
      document.getElementById("password").focus();
    } finally {
      boton.disabled = false;
      boton.textContent = "Ingresar";
    }
  });
</script>
</body>
</html>
